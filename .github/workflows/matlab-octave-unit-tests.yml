name: MATLAB and Octave unit tests

on:
  pull_request:
    branches: [main]
    paths:
      - common/electrical/matlab-octave/permanent_magnet_machines_tools/**
      - .github/workflows/matlab-octave-unit-tests.yml
  push:
    branches: [main]
    paths:
      - common/electrical/matlab-octave/permanent_magnet_machines_tools/**
      - .github/workflows/matlab-octave-unit-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electrical-machines-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # MOxUnit upstream master as reviewed on 2026-08-29; intentionally immutable.
  MOXUNIT_COMMIT: 39de87844cccf33c79283c881e221a97207a9b83
  TOOLBOX_ROOT: common/electrical/matlab-octave/permanent_magnet_machines_tools

jobs:
  octave:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned MOxUnit
        uses: actions/checkout@v6
        with:
          repository: MOxUnit/MOxUnit
          ref: ${{ env.MOXUNIT_COMMIT }}
          path: .ci-tools/MOxUnit
      - name: Confirm GNU Octave container version
        run: docker run --rm --entrypoint octave ghcr.io/gnu-octave/octave:11.3.0 --version
      - name: Run shared MOxUnit tests
        run: >-
          docker run --rm --entrypoint octave
          -v "$GITHUB_WORKSPACE:/workspace" -w /workspace
          ghcr.io/gnu-octave/octave:11.3.0 --no-gui --quiet --eval
          "addpath(fullfile(pwd,'$TOOLBOX_ROOT','ci'));
          run_unit_tests(fullfile(pwd,'.ci-tools','MOxUnit'),fullfile(pwd,'test-results','octave.xml'));"
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octave-unit-test-results
          path: test-results/octave.xml

  matlab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned MOxUnit
        uses: actions/checkout@v6
        with:
          repository: MOxUnit/MOxUnit
          ref: ${{ env.MOXUNIT_COMMIT }}
          path: .ci-tools/MOxUnit
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Run the same shared MOxUnit tests
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(fullfile(pwd,'${{ env.TOOLBOX_ROOT }}','ci'));
            run_unit_tests(fullfile(pwd,'.ci-tools','MOxUnit'),fullfile(pwd,'test-results','matlab.xml'));
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-unit-test-results
          path: test-results/matlab.xml

  matlab-fea:
    name: MATLAB XFEMM real FEA
    runs-on: ubuntu-22.04
    env:
      RNFOUNDRY_RUN_FEA_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
      - name: Check out pinned MOxUnit
        uses: actions/checkout@v6
        with:
          repository: MOxUnit/MOxUnit
          ref: ${{ env.MOXUNIT_COMMIT }}
          path: .ci-tools/MOxUnit
      - name: Check out latest XFEMM development branch
        uses: actions/checkout@v6
        with:
          repository: crobarcro/xfemm
          path: .ci-tools/xfemm
      - name: Record tested XFEMM revision
        run: git -C .ci-tools/xfemm rev-parse HEAD
      - name: Set up supported MATLAB MEX compiler pairing
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Build required XFEMM session interfaces
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(fullfile(pwd,'.ci-tools','xfemm','mfemm'));
            mfemm_setup('ForceMexRecompile',true,'RunTests',false,
            'Clean',true,'Tidy',true,'SessionOnly',true);
      - name: Probe XFEMM native session runtime
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(fullfile(pwd,'.ci-tools','xfemm','mfemm'));
            mfemm_setup('SessionOnly',true);
            fprintf('xfemm.femmsession: %s\n',which('xfemm.femmsession'));
            fprintf('session_interface_mex: %s\n',which('session_interface_mex'));
            fprintf('fpproc_interface_mex: %s\n',which('fpproc_interface_mex'));
            assert(~isempty(which('xfemm.femmsession')));
            assert(exist('session_interface_mex','file')==3);
            assert(exist('fpproc_interface_mex','file')==3);
            Test_femmsession;
      - name: Run complete rnfoundry real-FEA suite
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(fullfile(pwd,'.ci-tools','xfemm','mfemm'));
            mfemm_setup('SessionOnly',true);
            addpath(fullfile(pwd,'${{ env.TOOLBOX_ROOT }}','ci'));
            success=run_fea_tests(fullfile(pwd,'.ci-tools','MOxUnit'),
            fullfile(pwd,'test-results','matlab-fea.xml'));
            if isempty(success), error('rnfoundry:test:FEATestsUnavailable',
            'Required MATLAB XFEMM tests did not execute.'); end
      - name: Upload FEA JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-fea-test-results
          path: test-results/matlab-fea.xml
